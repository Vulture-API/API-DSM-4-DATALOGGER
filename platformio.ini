[platformio]
default_envs = esp32dev

[env:esp32dev]
; 6.x traz o core Arduino 2.0.17, usado na validação da compilação
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; mostra o que é digitado e só envia no Enter (comandos "status" e "intervalo N")
monitor_echo = yes
monitor_filters = send_on_enter
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  knolleary/PubSubClient@^2.8

; Testes da lógica pura no computador, sem placa
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
test_build_src = no
